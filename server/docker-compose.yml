name: hkbk_glug_server
services:
  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://db:27017/hkglug
      - NODE_ENV=production
    depends_on:
      - db
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017" # Exposed for local debugging, remove in production if not needed

volumes:
  mongo-data:
